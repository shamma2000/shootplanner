AWSTemplateFormatVersion: "2010-09-09"
Description: Private PostgreSQL RDS database for ShootPlanner

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  ApiSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to the API compute service
  DatabaseName:
    Type: String
    Default: shootplanner
  MasterUsername:
    Type: String
    Default: shootplanner_admin
  InstanceClass:
    Type: String
    Default: db.t4g.micro

Resources:
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL only from the ShootPlanner API
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApiSecurityGroupId

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: ShootPlanner private database subnets
      SubnetIds: !Ref PrivateSubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBName: !Ref DatabaseName
      DBInstanceClass: !Ref InstanceClass
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      Engine: postgres
      EngineVersion: "17"
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: !Ref MasterUsername
      ManageMasterUserPassword: true
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DeletionProtection: true
      MultiAZ: false
      PubliclyAccessible: false
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId

Outputs:
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabasePort:
    Value: !GetAtt Database.Endpoint.Port
  MasterSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
